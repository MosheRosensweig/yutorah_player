<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Classic recognizable curved Ram's Horn Shofar -->
  <path d="M12 76 C 22 72, 34 54, 48 42 C 60 32, 74 26, 88 26 C 91 26, 93 28, 93 32 C 93 42, 85 52, 74 58 C 58 66, 44 68, 28 82 C 20 90, 10 88, 8 82 C 7 79, 9 77, 12 76 Z" 
        fill="url(#shofarGrad)" stroke="#6e4215" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Ridges & texture along horn -->
  <path d="M42 45 C 47 50, 48 57, 43 64" stroke="#8d5620" stroke-width="2" stroke-linecap="round"/>
  <path d="M55 36 C 61 42, 63 50, 58 57" stroke="#8d5620" stroke-width="2" stroke-linecap="round"/>
  <path d="M68 30 C 74 36, 76 43, 72 50" stroke="#8d5620" stroke-width="2" stroke-linecap="round"/>
  <path d="M80 27 C 85 33, 86 40, 83 45" stroke="#8d5620" stroke-width="2" stroke-linecap="round"/>
  <!-- Bell / opening ellipse -->
  <ellipse cx="89" cy="35" rx="4" ry="9" fill="#4a2909" stroke="#6e4215" stroke-width="2"/>
  <!-- Mouthpiece -->
  <circle cx="10" cy="79" r="3.5" fill="#3a1e05" stroke="#6e4215" stroke-width="1.5"/>
  <defs>
    <linearGradient id="shofarGrad" x1="10" y1="85" x2="90" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a280d"/>
      <stop offset="25%" stop-color="#8c5828"/>
      <stop offset="60%" stop-color="#d4a373"/>
      <stop offset="85%" stop-color="#fae1b8"/>
      <stop offset="100%" stop-color="#e8c28c"/>
    </linearGradient>
  </defs>
</svg>
