<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Classic Solid Brass Chanukiah -->
  <!-- Stepped Base -->
  <path d="M26 92 L74 92 L68 85 L32 85 Z" fill="#d4af37" stroke="#8d7010" stroke-width="2" stroke-linejoin="round"/>
  <rect x="44" y="78" width="12" height="7" fill="#d4af37" stroke="#8d7010" stroke-width="1.5"/>
  <!-- Central Shaft -->
  <rect x="47.5" y="36" width="5" height="46" fill="#d4af37" stroke="#8d7010" stroke-width="1.5"/>

  <!-- 4 Symmetrical Curved Golden Branches -->
  <!-- Inner Pair (branches 4 & 5) -->
  <path d="M42 44 C 42 66, 48 66, 48 66" stroke="#d4af37" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M58 44 C 58 66, 52 66, 52 66" stroke="#d4af37" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Pair 2 (branches 3 & 6) -->
  <path d="M34 44 C 34 71, 48 71, 48 71" stroke="#d4af37" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M66 44 C 66 71, 52 71, 52 71" stroke="#d4af37" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Pair 3 (branches 2 & 7) -->
  <path d="M26 44 C 26 76, 48 76, 48 76" stroke="#d4af37" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M74 44 C 74 76, 52 76, 52 76" stroke="#d4af37" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Outer Pair (branches 1 & 8) -->
  <path d="M18 44 C 18 80, 48 80, 48 80" stroke="#d4af37" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M82 44 C 82 80, 52 80, 52 80" stroke="#d4af37" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Candle Cups -->
  <rect x="47.5" y="32" width="5" height="8" rx="1" fill="#2b4c7e" stroke="#1b3356" stroke-width="1"/><rect x="79.5" y="36" width="5" height="8" rx="1" fill="#2b4c7e" stroke="#1b3356" stroke-width="1"/><rect x="71.5" y="36" width="5" height="8" rx="1" fill="#2b4c7e" stroke="#1b3356" stroke-width="1"/><rect x="63.5" y="36" width="5" height="8" rx="1" fill="#2b4c7e" stroke="#1b3356" stroke-width="1"/><rect x="55.5" y="36" width="5" height="8" rx="1" fill="#2b4c7e" stroke="#1b3356" stroke-width="1"/><rect x="39.5" y="36" width="5" height="8" rx="1" fill="#2b4c7e" stroke="#1b3356" stroke-width="1"/><rect x="31.5" y="36" width="5" height="8" rx="1" fill="#2b4c7e" stroke="#1b3356" stroke-width="1"/><rect x="23.5" y="36" width="5" height="8" rx="1" fill="#2b4c7e" stroke="#1b3356" stroke-width="1"/><rect x="15.5" y="36" width="5" height="8" rx="1" fill="#2b4c7e" stroke="#1b3356" stroke-width="1"/>

  <!-- Active Flames -->
  
      <!-- Flame at x=50 -->
      <path d="M50 20 C 47 25, 46 29, 50 32 C 54 29, 53 25, 50 20 Z" fill="url(#flameGrad)" filter="drop-shadow(0 0 2px rgba(243,156,18,0.8))" transform="scale(1.15)" transform-origin="50 26"/>
      <ellipse cx="50" cy="28" rx="1.5" ry="2.5" fill="#ffffff" opacity="0.8"/>
    
      <!-- Flame at x=82 -->
      <path d="M82 24 C 79 29, 78 33, 82 36 C 86 33, 85 29, 82 24 Z" fill="url(#flameGrad)" filter="drop-shadow(0 0 2px rgba(243,156,18,0.8))" transform="scale(1.0)" transform-origin="82 30"/>
      <ellipse cx="82" cy="32" rx="1.5" ry="2.5" fill="#ffffff" opacity="0.8"/>
    

  <defs>
    <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="40%" stop-color="#f39c12"/>
      <stop offset="90%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
</svg>